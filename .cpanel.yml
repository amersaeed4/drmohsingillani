---
deployment:
  tasks:
    - export DEPLOYPATH=/home/drmohsin/public_html/
    - /bin/tar -cf - --exclude=./.git --exclude=./.cpanel.yml --exclude=./.env --exclude=./cache --exclude=./logs --exclude=./tmp --exclude=./backup --exclude=./user/accounts --exclude=./user/data . | /bin/tar -xf - -C $DEPLOYPATH
    - /bin/cp -Rn ./user/accounts ./user/data ${DEPLOYPATH}user/
    - /bin/mkdir -p ${DEPLOYPATH}cache ${DEPLOYPATH}logs ${DEPLOYPATH}tmp ${DEPLOYPATH}backup
    - /bin/rm -rf ${DEPLOYPATH}cache/*
    - /bin/chmod 750 $DEPLOYPATH
