title: Team Page
extends@: default
form:
  fields:
    tabs:
      type: tabs
      active: 1
      fields:
        content:
          fields:
            header.lead:
              type: textarea
              rows: 2
              label: Intro text
              style: vertical
        team:
          type: tab
          title: Team Members
          fields:
            header.groups:
              type: list
              label: Groups
              help: Add one group per department (e.g. Management, Medical team). Drag to reorder.
              style: vertical
              fields:
                .title:
                  type: text
                  label: Group heading
                .members:
                  type: list
                  label: Members
                  style: vertical
                  fields:
                    .name:
                      type: text
                      label: Name
                    .role:
                      type: text
                      label: Role / speciality
                    .photo:
                      type: filepicker
                      label: Photo
                      folder: '@self'
                      preview_images: true
                      accept:
                      - .png
                      - .jpg
                      - .jpeg
                      - .webp
        seo:
          type: tab
          title: SEO
          import@:
            type: partials/seo
            context: blueprints://pages
